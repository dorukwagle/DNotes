# A friendly description of the file type.
# This text can appear in the operating system's UI, like in the "file type" column in Windows Explorer.
description=DNotes Note File

# The file extension to associate with your application.
# Do not include the dot.
extension=dnt

# The MIME type for your custom file format.
# This is a standard way to identify file types. The "application/x-" prefix
# is a common convention for custom, non-standard application formats.
mime-type=application/x-dnt

# (Optional) The icon to use for the file itself.
# This tells the OS to display this specific icon for all .dnt files,
# instead of a generic file icon or your application's icon.
# You need to provide the path relative to your project's root.
# Make sure you have created the icon file (e.g., dnt-file-icon.ico for Windows).
icon=src/main/resources/icon.png